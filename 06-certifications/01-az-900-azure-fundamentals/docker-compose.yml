# C1 (AZ-900) modülünün yerel altyapısı — Azure hesabı gerektirmeyen laboratuvarlar için.
#   docker compose up -d     → Azurite (Blob 10000, Queue 10001, Table 10002)
#   docker compose down -v   → durdur ve veriyi sil
# Kullanan konu: C1.8 (dotnet run -- 1.8 4)
services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    container_name: c01-azurite
    # --skipApiVersionCheck: SDK, emülatörün henüz tanımadığı daha yeni bir REST API sürümü isteyebilir
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --location /data --skipApiVersionCheck
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite-data:/data

volumes:
  azurite-data:
